services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-map1_turkey}
      POSTGRES_USER: ${POSTGRES_USER:-map1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-map1} -d ${POSTGRES_DB:-map1_turkey}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
      - ../test-results:/app/artifacts
    environment:
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-en}
      APP_SUPPORTED_LOCALES: ${APP_SUPPORTED_LOCALES:-en}
      BACKEND_BASIC_AUTH_USER: ${DEV_BACKEND_BASIC_AUTH_USER:-}
      BACKEND_BASIC_AUTH_PASSWORD: ${DEV_BACKEND_BASIC_AUTH_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-map1_turkey}
      POSTGRES_USER: ${POSTGRES_READ_USER:-map1_read}
      POSTGRES_PASSWORD: ${POSTGRES_READ_PASSWORD:?POSTGRES_READ_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-map1_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      STAGE5_RULES_WRITE_TOKEN: ${STAGE5_RULES_WRITE_TOKEN:-}
      CDSE_CLIENT_ID: ""
      CDSE_CLIENT_SECRET: ""
      CDSE_USERNAME: ""
