[Service]
EnvironmentFile=-/srv/map1/secrets/backup-alert-map1-offsite-backup-check.service.env
# Keep hourly freshness separate from the daily backup's heartbeat.
ExecStartPre=-/usr/bin/python3 /srv/map1/bin/backup_heartbeat.py start
ExecStartPost=-/usr/bin/python3 /srv/map1/bin/backup_heartbeat.py success
