    profiles: ["demo"]
    command: >
      sh -c 'test -n "$$CADDY_BASIC_AUTH_HASH" || { echo "CADDY_BASIC_AUTH_HASH is required"; exit 1; };
      caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      CADDY_DEMO_DOMAIN: ${CADDY_DEMO_DOMAIN:-localhost}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:-review}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:-}
      CADDY_BACKEND_AUTH_HEADER: ${CADDY_BACKEND_AUTH_HEADER:-}
    ports:
      - "${HTTP_BIND_ADDRESS:?HTTP_BIND_ADDRESS is required}:${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_BIND_ADDRESS:?HTTPS_BIND_ADDRESS is required}:${HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
