services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-map1_turkey}
      POSTGRES_USER: ${POSTGRES_USER:-map1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${POSTGRES_STAGE4_TABLESPACE_HOST_DIR:-../test-results/postgres-stage4-tablespace}:/var/lib/postgresql/stage4_tablespace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-map1} -d ${POSTGRES_DB:-map1_turkey}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: infra-backend
    build:
      context: ../backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2}
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-en}
      APP_SUPPORTED_LOCALES: ${APP_SUPPORTED_LOCALES:-en}
      BACKEND_BASIC_AUTH_USER: ${BACKEND_BASIC_AUTH_USER:-}
      BACKEND_BASIC_AUTH_PASSWORD: ${BACKEND_BASIC_AUTH_PASSWORD:-}
      TRUST_LOCAL_REVERSE_PROXY_ONLY: ${TRUST_LOCAL_REVERSE_PROXY_ONLY:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-map1_turkey}
      POSTGRES_USER: ${POSTGRES_READ_USER:?POSTGRES_READ_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_READ_PASSWORD:?POSTGRES_READ_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      STAGE5_RULES_WRITE_TOKEN: ${STAGE5_RULES_WRITE_TOKEN:-}
      CDSE_CLIENT_ID: ""
      CDSE_CLIENT_SECRET: ""
      CDSE_USERNAME: ""
      CDSE_PASSWORD: ""
      CDSE_AUTH_GRANT_TYPE: auto
      CDSE_TOTP: ""
      CDSE_PROXY_URL: ""
      SENTINEL_HUB_STATISTICS_URL: ${SENTINEL_HUB_STATISTICS_URL:-https://sh.dataspace.copernicus.eu/api/v1/statistics}
