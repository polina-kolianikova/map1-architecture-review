name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check tracked files for secrets
        run: scripts/check-tracked-secrets.sh

      - name: Test backup failure handling and recovery transfers
        run: |
          python -m pip install --index-url https://pypi.org/simple -r backend/requirements.txt -r scripts/tests/requirements.txt
          python -m unittest discover -s scripts/tests -p 'test_*.py'

        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build backend image
        run: docker build backend

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate development compose file
        run: docker compose -f infra/docker-compose.yml --profile tools config --no-interpolate --no-env-resolution --quiet

      - name: Validate production compose file
        run: docker compose -f infra/docker-compose.prod.yml --profile demo config --no-interpolate --no-env-resolution --quiet
