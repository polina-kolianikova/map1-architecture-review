name: Validate architecture sample
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -p test_contracts.py -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m unittest discover -s backend/tests -p test_showcase_scan.py -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/export_contracts.py --check
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/check_showcase.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
